version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
        VITE_WS_URL: ws://localhost:8080/ws
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
